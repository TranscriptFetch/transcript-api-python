[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "transcriptfetch-sdk"
dynamic = ["version"]
description = "Official Python SDK for the TranscriptFetch API: a production transcript API for YouTube, TikTok, Instagram and direct media URLs, as clean, typed data."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "TranscriptFetch", email = "support@transcriptfetch.com" }]
keywords = ["youtube", "tiktok", "instagram", "transcript", "captions", "subtitles", "api", "sdk", "rag", "llm"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.24",
  "pydantic>=2",
]

[project.urls]
Homepage = "https://transcriptfetch.com"
Documentation = "https://transcriptfetch.com/docs"
Source = "https://github.com/TranscriptFetch/transcript-api-python"
Issues = "https://github.com/TranscriptFetch/transcript-api-python/issues"

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pytest-asyncio>=0.23",
  "respx>=0.20",
  "ruff>=0.5",
  "mypy>=1.8",
]

[tool.hatch.version]
path = "src/transcriptfetch/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/transcriptfetch"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
# No "UP" (pyupgrade): we target 3.9 and Pydantic evaluates annotations at
# runtime, where PEP 604 (X | None) unions are invalid on <3.10.
select = ["E", "F", "I", "B", "W"]

[tool.mypy]
# Analysis target (min this mypy supports); the package itself still runs on 3.9.
python_version = "3.10"
strict = true
files = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
